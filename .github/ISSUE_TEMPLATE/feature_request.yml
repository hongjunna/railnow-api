name: Feature request / 기능 요청
description: New endpoints, fields, lines or improvements. 새 엔드포인트, 필드, 노선, 개선 제안.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you building? / 만들고 있는 것
      description: What you are trying to do and what is missing today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal / 제안
      description: The endpoint, field or behavior you would like.
    validations:
      required: true
